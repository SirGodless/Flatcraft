services:
  flatcraft:
    build: .
    ports:
      # host:container - the reverse proxy forwards to this host port.
      - "8080:8080"
    volumes:
      # World save + accounts live here; survives image updates.
      - flatcraft-data:/data
    environment:
      SERVER_NAME: "FlatCraft"
      # SEED: "1337"        # seed for freshly generated worlds
      # RESET_WORLD: "true"   # wipe the world on next boot (old save kept as a backup); remove this line again after one restart
      # RESET_PLAYERS: "true" # keep the world, but reset every player's saved state (position/inventory/health)
      OIDC_ISSUER: "${OIDC_ISSUER}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET}"
      PUBLIC_URL: "${PUBLIC_URL}"
    restart: unless-stopped
    networks:
      - default
      - caddy_net

networks:
  default:
  caddy_net:
    external: true

volumes:
  flatcraft-data:
