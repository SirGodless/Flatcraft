# Apache reverse-proxy vhost for a FlatCraft dedicated server.
#
# 1. Replace YOUR_ADDRESS with your domain (e.g. flatcraft.example.net)
#    and rename this file accordingly.
# 2. Enable the required modules:
#      a2enmod proxy proxy_http ssl
#    (Apache >= 2.4.47 proxies WebSockets via `upgrade=websocket`; for
#    older versions enable `proxy_wstunnel` and see the note below.)
# 3. Point the SSL paths at your certificate (e.g. from certbot).
#
# The FlatCraft container listens on localhost:8080 (see docker-compose.yml).

<VirtualHost *:80>
    ServerName YOUR_ADDRESS
    # Everything to HTTPS.
    RewriteEngine On
    RewriteRule ^(.*)$ https://YOUR_ADDRESS$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName YOUR_ADDRESS

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/YOUR_ADDRESS/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/YOUR_ADDRESS/privkey.pem

    ProxyPreserveHost On

    # Apache >= 2.4.47: one rule handles HTTP and the game's WebSocket.
    ProxyPass        / http://localhost:8080/ upgrade=websocket
    ProxyPassReverse / http://localhost:8080/

    # Apache < 2.4.47: comment out the two lines above, enable
    # mod_proxy_wstunnel, and use these instead (the game's WebSocket
    # lives on the fixed path /ws):
    #ProxyPass        /ws ws://localhost:8080/ws
    #ProxyPass        /   http://localhost:8080/
    #ProxyPassReverse /   http://localhost:8080/
</VirtualHost>
